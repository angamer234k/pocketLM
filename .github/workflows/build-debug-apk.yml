name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketlm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/pocketlm-${CODE}.apk"
          printf '%s\n' "{\"versionCode\":${CODE},\"versionName\":\"${NAME}\",\"notes\":\"CI build ${{ github.run_number }}\"}" > dist/version.json
          cat dist/version.json

      - name: Publish latest release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: pocketLM latest
          prerelease: true
          make_latest: true
          body: |
            Sideload build. versionCode also in version.json asset + latest.json on main.
          files: |
            dist/*.apk
            dist/version.json

      - name: Summarize
        if: always()
        run: |
          echo "## pocketLM debug APK" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/ >> "$GITHUB_STEP_SUMMARY" || true
